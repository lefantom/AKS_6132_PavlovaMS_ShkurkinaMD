
<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Путешествие</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header>
    <h1>Путешествие</h1>
    <p>Добавление и редактирование поездок</p>
</header>

<main class="container">

    <a href="/trips" class="back-link">← К списку путешествий</a>

    <h2>Данные путешествия</h2>

    <form th:action="@{/trips/save}"
          th:object="${trip}"
          method="post">

        <input type="hidden" th:field="*{id}">

        <div class="form-group">
            <label>Название путешествия:</label>
            <input type="text"
                   th:field="*{name}"
                   maxlength="150"
                   required>
        </div>

        <div class="form-group">
            <label>Страна:</label>
            <input type="text"
                   th:field="*{country}"
                   maxlength="100"
                   required>
        </div>

        <div class="form-group">
            <label>Город:</label>
            <input type="text"
                   th:field="*{city}"
                   maxlength="100"
                   required>
        </div>

        <div class="form-group">
            <label>Пользователь:</label>
            <select name="userId" required>
                <option value="" disabled
                        th:selected="${trip.user == null}">
                    Выберите пользователя
                </option>

                <option th:each="user : ${users}"
                        th:value="${user.id}"
                        th:text="${user.username}"
                        th:selected="${trip.user != null and trip.user.id == user.id}">
                </option>
            </select>
        </div>

        <button type="submit" class="button">Сохранить</button>
        <a href="/trips" class="button button-secondary">Отмена</a>

    </form>

</main>
</body>
</html>
